name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e . pytest
      - name: Test
        run: pytest

  wheel-smoke:
    # A non-editable install byte-compiles the templates; make sure the
    # installed tool still generates both flavors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build and install wheel
        run: |
          pip install build
          python -m build --wheel
          pip install dist/*.whl
      - name: Generate both flavors
        working-directory: ${{ runner.temp }}
        run: |
          goldpath list
          goldpath new orders-api --flavor fastapi
          goldpath new inventory-svc --flavor go
      - name: Build and test the generated FastAPI service
        working-directory: ${{ runner.temp }}/orders-api
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          ruff check .
          pytest
      - name: Build and test the generated Go service
        working-directory: ${{ runner.temp }}/inventory-svc
        run: |
          go vet ./...
          go build ./...
          go test ./...
      - name: Build the Docker images for both generated services
        run: |
          docker build -t orders-api:latest ${{ runner.temp }}/orders-api
          docker build -t inventory-svc:latest ${{ runner.temp }}/inventory-svc
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Create a local kind cluster
        run: kind create cluster --name golden-path-ci --wait 120s
      - name: Load the images into the kind cluster
        run: |
          kind load docker-image orders-api:latest --name golden-path-ci
          kind load docker-image inventory-svc:latest --name golden-path-ci
      - name: Apply the generated k8s manifests and wait for Ready pods
        run: |
          kubectl apply -f ${{ runner.temp }}/orders-api/k8s/
          kubectl apply -f ${{ runner.temp }}/inventory-svc/k8s/
          kubectl rollout status deployment/orders-api --timeout=120s
          kubectl rollout status deployment/inventory-svc --timeout=120s
