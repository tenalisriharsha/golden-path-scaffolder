[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "golden-path-scaffolder"
version = "0.1.0"
description = "One command scaffolds a production-ready service on the golden path: Dockerfile, CI, Kubernetes, metrics, dashboards, tests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
goldpath = "goldpath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
goldpath = ["templates/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
